<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyszukaj gierkę</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: -apple-system, sans-serif;
      min-height: 100svh;
      margin: 0;
      padding: 32px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 650px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .links {
      text-align: left;
      margin-top: 20px;
    }

    .links a {
      display: block;
      padding: 10px;
      margin: 6px 0;
      background: #f2f2f2;
      border-radius: 6px;
      text-decoration: none;
      color: #000;
    }

    .links a:hover {
      background: #e6e6e6;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }

      h2 {
        font-size: 24px;
        margin-top: 0;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>

    <h2>Wyszukaj gierkę</h2>

    <input id="game" placeholder="Podaj tytuł gry..." />
    <button onclick="generateLinks()">Wygeneruj linki do sklepów</button>

    <div class="links" id="links"></div>
  </main>

  <script>
    const stores = [
      {
        name: "Empik",
        url: (q) => `https://www.empik.com/szukaj/produkt?q=${q}`
      },
      {
        name: "Media Markt",
        url: (q) => `https://www.mediamarkt.pl/pl/search.html?query=${q}`
      },
      {
        name: "Allegro",
        url: (q) => `https://allegro.pl/listing?string=${q}`
      },
      {
        name: "Ultima",
        url: (q) => `https://www.ultima.pl/search/?keywords=${q}`
      },
      {
        name: "Perfect Blue",
        url: (q) => `https://perfectblue.pl/?s=${q}&post_type=product`
      },
      {
        name: "X-Kom",
        url: (q) => `https://www.x-kom.pl/szukaj?q=${q}`
      },
      {
        name: "Media Expert",
        url: (q) =>
          `https://www.mediaexpert.pl/search?query[menu_item]=&query[querystring]=${q}`
      },
      {
        name: "RTV Euro AGD",
        url: (q) =>
          `https://www.euro.com.pl/search.bhtml?keyword=${q}`
      }
    ];

    function generateLinks() {
      const game = document.getElementById("game").value.trim();
      if (!game) return;

      const encoded = encodeURIComponent(game);
      const container = document.getElementById("links");

      container.innerHTML = "";

      stores.forEach(store => {
        const url = store.url(encoded);

        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.textContent = "" + store.name;

        container.appendChild(a);
      });
    }

    document.getElementById("game").addEventListener("keydown", (e) => {
      if (e.key === "Enter") generateLinks();
    });
  </script>

</body>
</html>
